services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: admit, POSTGRES_PASSWORD: admit, POSTGRES_DB: admissions }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://admit:admit@db:5432/admissions
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
volumes: { pgdata: {} }
